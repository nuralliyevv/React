name: Deploy React Projects to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build task2
        working-directory: task2
        run: |
          npm ci
          npm run build

      - name: Install and build task3
        working-directory: task3
        run: |
          npm ci
          npm run build

      - name: Install and build FitTrack
        working-directory: midterm
        run: |
          npm ci
          npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p site/task3
          mkdir -p site/midterm

          cp -R task2/dist/. site/
          cp -R task3/dist/. site/task3/
          cp -R midterm/dist/. site/midterm/

          touch site/.nojekyll

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4